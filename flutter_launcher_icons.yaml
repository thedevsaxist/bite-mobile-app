# App icons from the bite brand (design artboard B2).
# Regenerate with: dart run flutter_launcher_icons
# Source PNGs in assets/brand are rendered from the bite mark SVG.
flutter_launcher_icons:
  image_path: assets/brand/app_icon_ios.png
  ios: true
  remove_alpha_ios: true
  android: launcher_icon
  min_sdk_android: 24
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/brand/app_icon_android_foreground.png
  adaptive_icon_monochrome: assets/brand/app_icon_android_monochrome.png
